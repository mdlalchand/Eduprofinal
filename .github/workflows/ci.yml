name: CI & Release Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  node-and-frontend:
    name: TypeScript Lint, Unit Tests & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint
      - run: bun run build
      - name: Run unit and integration tests
        run: bunx tsx --test src/lib/*.test.ts src/server/*.test.ts
      - name: Build and verify installable Laravel ZIP archive
        run: |
          mkdir -p public/downloads
          rm -f public/downloads/academy-lms-laravel13.zip
          cd laravel-system
          zip -qr ../public/downloads/academy-lms-laravel13.zip . \
            -x '.env' 'vendor/*' 'storage/installed.lock' 'storage/logs/*' 'storage/framework/cache/*' 'storage/framework/sessions/*' 'storage/framework/views/*'
          cd ..
          unzip -t public/downloads/academy-lms-laravel13.zip
          ! unzip -l public/downloads/academy-lms-laravel13.zip | grep -qE '(^|/)(\.env|storage/installed\.lock)'
      - uses: actions/upload-artifact@v4
        with:
          name: academy-lms-laravel13-installer
          path: public/downloads/academy-lms-laravel13.zip
          if-no-files-found: error
          retention-days: 30

  laravel-production-suite:
    name: Laravel 13 PHP 8.3 Feature & Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel-system
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_sqlite, pdo_mysql, pdo_pgsql, zip, gd, xml, ctype, bcmath
      - run: composer install --no-interaction --prefer-dist
      - name: Prepare isolated testing environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
      - name: Run Laravel database migrations and live HTTP smoke test
        run: |
          sed -i \
            -e 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' \
            -e "s#^DB_DATABASE=.*#DB_DATABASE=$GITHUB_WORKSPACE/laravel-system/database/database.sqlite#" \
            -e 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' \
            -e 's/^CACHE_STORE=.*/CACHE_STORE=file/' \
            -e 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' \
            .env
          touch database/database.sqlite
          php artisan migrate --force
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/edupro-laravel.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/login/student >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/login/student >/dev/null
          curl --fail --silent http://127.0.0.1:8000/register/branch >/dev/null
          curl --fail --silent http://127.0.0.1:8000/register/student >/dev/null
          curl --fail --silent http://127.0.0.1:8000/register/guardian >/dev/null
          curl --fail --silent http://127.0.0.1:8000/register/teacher >/dev/null
          curl --fail --silent http://127.0.0.1:8000/recover/branch >/dev/null
          curl --fail --silent http://127.0.0.1:8000/recover/student >/dev/null
          curl --fail --silent http://127.0.0.1:8000/recover/guardian >/dev/null
          curl --fail --silent http://127.0.0.1:8000/recover/teacher >/dev/null
          echo 'Laravel HTTP smoke test passed for all four self-service roles.'
      - name: Run Laravel Feature & Unit Test Suite
        run: php artisan test --stop-on-failure
