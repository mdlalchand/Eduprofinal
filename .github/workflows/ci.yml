name: Laravel 13 Production CI

on:
  push:
    branches: [main, master, "conversion/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laravel-production:
    name: Laravel 13 PHP 8.3 Tests, Migrations & Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          extensions: mbstring, openssl, pdo_sqlite, pdo_mysql, pdo_pgsql, zip, gd, xml, ctype, bcmath, curl, tokenizer

      - name: Validate PHP syntax
        run: |
          find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Prepare writable Laravel runtime directories
        run: |
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/framework/testing storage/logs storage/app/backups storage/app/private storage/app/public storage/app/update-rollback storage/app/update-staging
          chmod -R ug+rwX bootstrap/cache storage

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare isolated test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          sed -i \
            -e 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' \
            -e "s#^DB_DATABASE=.*#DB_DATABASE=$GITHUB_WORKSPACE/database/database.sqlite#" \
            -e 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' \
            -e 's/^CACHE_STORE=.*/CACHE_STORE=file/' \
            -e 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' \
            .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run Laravel unit and feature tests
        run: php artisan test --stop-on-failure

      - name: Verify route registration and Laravel boot
        run: |
          php artisan route:list --except-vendor
          php artisan about

      - name: HTTP smoke test for public and role-based routes
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/edupro-laravel.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep 1
          done
          for path in / /courses /instructors /products /ebooks /board-result /community /verify-certificate /login/student /login/teacher /login/guardian /login/branch /register/student /register/teacher /register/guardian /register/branch /recover/student /recover/teacher /recover/guardian /recover/branch; do
            curl --fail --silent "http://127.0.0.1:8000$path" >/dev/null
          done

      - name: Build Laravel-only installable archive
        run: |
          mkdir -p public/downloads
          rm -f public/downloads/academy-lms-laravel13.zip
          zip -qr public/downloads/academy-lms-laravel13.zip . \
            -x '.env' '.env.local' '.env.production' '.env.staging' 'vendor/*' '.git/*' 'storage/installed.lock' 'storage/logs/*' 'storage/framework/cache/*' 'storage/framework/sessions/*' 'storage/framework/views/*' 'storage/framework/testing/*' 'bootstrap/cache/*.php' 'public/downloads/*'
          unzip -t public/downloads/academy-lms-laravel13.zip
          ! unzip -l public/downloads/academy-lms-laravel13.zip | grep -qE '(^|/)(\.env|storage/installed\.lock)'

      - uses: actions/upload-artifact@v4
        with:
          name: edupro-laravel13-installer
          path: public/downloads/academy-lms-laravel13.zip
          if-no-files-found: error
          retention-days: 30
